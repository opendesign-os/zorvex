# The uv workspace of zorvex-api and zorvex-cli (libs/), and the tools both are checked with.

[project]
name = "zorvex-workspace"
version = "0.0.0"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["libs/*"]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pre-commit>=4.7.0",
    "ruff>=0.17.6",
    "ty>=0.0.108,<0.1.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "ARG",   # flake8-unused-arguments
    "SIM",   # flake8-simplify
]
ignore = [
    "E501",   # line length is the formatter's
    "B008",   # function calls in argument defaults (FastAPI's Depends)
    "B904",   # raise ... from err inside except
    "ARG001", # unused function argument
    "ARG002", # unused method argument
    "ARG005", # unused lambda argument
    "SIM108", # ternary operator
]

[tool.ruff.lint.isort]
known-first-party = ["zorvex_api", "zorvex_cli"]

[tool.bandit]
exclude_dirs = [".venv"]
skips = [
    "B101",  # assert statements
    "B404",  # import subprocess (the CLI runs docker, podman and uvicorn)
    "B603",  # subprocess without shell=True
    "B607",  # partial executable path
]
