[project]
name = "zorvex-api"
version = "0.0.3"
description = "The Zorvex server: the LangGraph Agent Server API, self-hosted on PostgreSQL"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
keywords = ["langgraph", "agents", "llm", "fastapi", "agent-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core
    "fastapi>=0.165.0",
    # [standard]: uvloop and httptools off Windows, and websockets for the WebSocket routes
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "sse-starlette>=3.7.1,<4.0.0",
    # Imported directly for CancelScope(shield=True)
    "anyio>=4.16.0",

    # LangGraph
    "langgraph>=1.2.24",
    "langchain-core>=1.8.4",
    "langgraph-sdk>=0.4.14",
    # Agent Protocol v2 types (event streaming)
    "langchain-protocol>=0.0.22",
    "langgraph-checkpoint-postgres>=3.2.1",

    # Database
    "sqlalchemy>=2.1.9",
    "greenlet>=3.5.6",
    "psycopg[binary,pool]>=3.3.9",
    "alembic>=1.20.1",

    # Observability (OpenTelemetry)
    "opentelemetry-api>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "openinference-instrumentation-langchain>=0.1.90",
    # HTTP server spans, and the W3C trace context of each request
    "opentelemetry-instrumentation-fastapi>=0.66b2",

    # Metrics
    "prometheus-fastapi-instrumentator>=8.1.0",

    # Agent interop protocols
    "mcp>=2.3.0",
    # MCP elicitation: answers are checked against the form, and decisions against their schema
    "jsonschema>=4.26.0",

    # Utils
    "structlog>=26.1.0",
    # structlog's colored console renderer needs it on Windows (LOG_FORMAT=console)
    "colorama>=0.4.6; sys_platform == 'win32'",
    "asgi-correlation-id>=5.0.1",
    # Run-completion webhook delivery
    "httpx>=0.28.1",
    # Retries with backoff, and Standard Webhooks signatures
    "tenacity>=9.1.2",
    "standardwebhooks>=1.3.0",

    # Redis (optional broker backend for multi-instance streaming)
    "redis[hiredis]>=8.2.0",

    # Cron expression parsing
    "croniter>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/opendesign-os/zorvex"
Source = "https://github.com/opendesign-os/zorvex/tree/main/libs/zorvex-api"
Issues = "https://github.com/opendesign-os/zorvex/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zorvex_api"]

[tool.hatch.build.targets.wheel.force-include]
"alembic.ini" = "zorvex_api/alembic.ini"
"alembic" = "zorvex_api/alembic"
