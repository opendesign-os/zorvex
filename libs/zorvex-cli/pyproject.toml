[project]
name = "zorvex-cli"
version = "0.0.1"
description = "Zorvex CLI - Manage your self-hosted agent deployments"
requires-python = ">=3.12"
license = "Apache-2.0"
keywords = ["langgraph", "agents", "cli", "docker", "deployment"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
]

dependencies = [
    # Core CLI
    "click>=8.5.1",
    "rich>=15.0.0",
    "python-dotenv>=1.2.4",

    # Server (always included)
    "zorvex-api~=0.0.1",
]

[project.optional-dependencies]
debug = ["debugpy>=1.8.22"]

[project.scripts]
zorvex = "zorvex_cli.cli:cli"

[tool.uv.sources]
zorvex-api = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zorvex_cli"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[dependency-groups]
dev = [
    "ruff>=0.17.6",
]
